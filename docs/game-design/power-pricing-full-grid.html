/* standalone theme (T3 injects its own) */
:root{--background:#0b0b0b;--foreground:#ededed;--muted:#1c1c1c;--muted-foreground:#9a9a9a;--card:#141414;--secondary:#242424;--border:#2e2e2e;--popover:#161616;--popover-foreground:#ededed;--radius:10px;--font-sans:-apple-system,system-ui,sans-serif;--chart-1:#3987e5;--chart-2:#d95926;--chart-3:#199e70;--chart-4:#c98500} html{background:var(--background);color:var(--foreground)} body{padding:20px;max-width:900px;margin:0 auto}
:root { --win: #3987e5; --lose: #e66767; }
body { margin: 0; }
.wrap { font-family: var(--font-sans); color: var(--foreground); font-size: 14px; line-height: 1.45; }
h2 { font-size: 16px; margin: 24px 0 4px; font-weight: 600; }
p.sub { color: var(--muted-foreground); margin: 0 0 10px; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { font: inherit; font-size: 13px; background: transparent; color: var(--muted-foreground); border: 0; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--secondary); color: var(--foreground); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.tile .k { color: var(--muted-foreground); font-size: 12px; }
.tile .big { font-size: 20px; font-weight: 700; margin: 2px 0; }
.tile .s { color: var(--muted-foreground); font-size: 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); margin: 4px 0 8px; }
.chart { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; display: none; z-index: 5; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
table.hm { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
table.hm td { width: 38px; height: 30px; text-align: center; font-size: 12px; border-radius: 4px; }
table.hm td.lop { outline: 1.5px solid var(--foreground); outline-offset: -1.5px; font-weight: 700; }
table.hm td.self { border: 1px dashed var(--border); }
table.hm th { font-size: 11px; font-weight: 500; color: var(--muted-foreground); padding: 1px 4px; white-space: nowrap; }
table.hm th.row { text-align: right; }
table.hm th.col { writing-mode: vertical-rl; transform: rotate(180deg); height: 64px; }
table.t { border-collapse: collapse; font-size: 12.5px; width: 100%; }
table.t td, table.t th { padding: 4px 7px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.t th { color: var(--muted-foreground); font-weight: 500; }
table.t td:first-child, table.t th:first-child { text-align: left; }
