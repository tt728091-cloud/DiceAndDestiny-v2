<style>
/* standalone theme (T3 injects its own) */
:root{--background:#0b0b0b;--foreground:#ededed;--muted:#1c1c1c;--muted-foreground:#9a9a9a;--card:#141414;--secondary:#242424;--border:#2e2e2e;--popover:#161616;--popover-foreground:#ededed;--radius:10px;--font-sans:-apple-system,system-ui,sans-serif;--chart-1:#3987e5;--chart-2:#d95926;--chart-3:#199e70;--chart-4:#c98500} html{background:var(--background);color:var(--foreground)} body{padding:20px;max-width:1000px;margin:0 auto}
:root { --win: #3987e5; --lose: #e66767; }
body { margin: 0; }
.wrap { font-family: var(--font-sans); color: var(--foreground); font-size: 14px; line-height: 1.45; }
h2 { font-size: 16px; margin: 24px 0 4px; font-weight: 600; }
p.sub { color: var(--muted-foreground); margin: 0 0 10px; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { font: inherit; font-size: 13px; background: transparent; color: var(--muted-foreground); border: 0; padding: 6px 11px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--secondary); color: var(--foreground); font-weight: 600; }
.chip { font: inherit; font-size: 12.5px; border: 1px solid var(--border); background: transparent; color: var(--muted-foreground); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chip.on { color: var(--foreground); border-color: var(--foreground); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.tile .k { color: var(--muted-foreground); font-size: 12px; }
.tile .big { font-size: 19px; font-weight: 700; margin: 2px 0; }
.tile .s { color: var(--muted-foreground); font-size: 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); margin: 4px 0 8px; }
.chart { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; display: none; z-index: 5; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.scroll { overflow-x: auto; }
table.hm { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
table.hm td { min-width: 26px; height: 24px; text-align: center; font-size: 11px; border-radius: 3px; }
table.hm td.lop { outline: 1.5px solid var(--foreground); outline-offset: -1.5px; font-weight: 700; }
table.hm td.self { border: 1px dashed var(--border); }
table.hm th { font-size: 10.5px; font-weight: 500; color: var(--muted-foreground); padding: 1px 3px; white-space: nowrap; }
table.hm th.row { text-align: right; }
table.hm th.col { writing-mode: vertical-rl; transform: rotate(180deg); height: 70px; }
table.t { border-collapse: collapse; font-size: 12.5px; width: 100%; }
table.t td, table.t th { padding: 4px 7px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.t th { color: var(--muted-foreground); font-weight: 500; }
table.t td:first-child, table.t th:first-child { text-align: left; }
</style></head>

    DEF.map((d, k) => `<button class="chip ${SHOW[k] ? 'on' : ''}" data-d="${k}"><span class="sw" style="background:${d.color}"></span>${d.name}</button>`).join('') + '</div>';
  h += `<p class="sub">Builds: average damage 6.2 to 18 with each defense, the rest of the XP in 10-XP blank cards (no starting deck). Prices: board 40 XP per point above 6.2; Holdfast 140 XP; 1-die block 15.5% and 2-dice block 28% of the XP left after the board. Toggle defenses to change the field; every mean and count is against the builds shown. Race model, exact card counts.</p>`;
  let lop = 0, tot = 0; for (const a of vis) for (const b of vis) if (a.i < b.i) { const s = sc(M[a.i][b.i]); tot++; if (s < 0.4 || s > 0.6) lop++; }
  const best = vis.reduce((a, b) => (b.mean > a.mean ? b : a)), worst = vis.reduce((a, b) => (b.mean < a.mean ? b : a));
  h += '<div class="tiles">' + `<div class="tile"><div class="k">Strongest build</div><div class="big">${short(best)}</div><div class="s">${DEF[best.def].name}, ${best.cards} cards · ${pct(best.mean)}%</div></div>` +
    `<div class="tile"><div class="k">Weakest build</div><div class="big">${short(worst)}</div><div class="s">${DEF[worst.def].name}, ${worst.cards} cards · ${pct(worst.mean)}%</div></div>` +
    DEF.map((d, k) => SHOW[k] ? (() => { const bb = vis.filter(b => b.def === k); if (!bb.length) return ''; const m = bb.reduce((a, b) => (b.mean > a.mean ? b : a)); return `<div class="tile"><div class="k">Best ${d.name}</div><div class="big">${m.damage.toFixed(1)} dmg</div><div class="s">${m.cards} cards · ${pct(m.mean)}%</div></div>`; })() : '').join('') +
    `<div class="tile"><div class="k">Lopsided pairings</div><div class="big">${lop} of ${tot}</div><div class="s">60/40 or worse</div></div></div>`;
  h += `<h2>Mean score against the field, by damage</h2><p class="sub">Each build's average chance to beat every other build shown, at ${X} XP. Shaded: 45–55%.</p>`;
  h += '<div class="legend">' + DEF.map((d, k) => SHOW[k] ? `<span><span class="sw" style="background:${d.color}"></span>${d.name}</span>` : '').join('') + '</div>';
  h += '<div class="chart" id="mc"><svg width="100%" height="260"></svg><div class="tip"></div></div>';
  h += `<h2>What each defense should cost</h2><p class="sub">The fair price: the price at which a character with that defense, picking its best damage, wins half its games against a no-defense character doing the same. Holdfast stays near 140 XP; block defenses keep a steady share of the XP left after the board, so their XP price grows with level.</p>`;
  h += '<table class="t"><tr><th>Total XP</th><th>Holdfast</th><th>Block: 1 die, a 6</th><th>Block: 2 dice, any 6</th><th>Block: 1 die, 5–6</th></tr>' +
    PRICES.map(r => `<tr><td>${r[0]}</td><td>${r[1]} XP (${r[2]}%)</td><td>${r[3]} XP (${r[4]}%)</td><td>${r[5]} XP (${r[6]}%)</td><td>${r[7]} XP (${r[8]}%)</td></tr>`).join('') +
    '<tr><td><b>Price rule</b></td><td><b>140 XP</b> (3.5 × 40)</td><td><b>15.5%</b> of what\'s left</td><td><b>28%</b> of what\'s left</td><td><b>30%</b> of what\'s left</td></tr></table>';
  h += `<h2>Every build against every build at ${X} XP</h2><p class="sub">Row build's chance to beat the column build (wins + ½ draws), %. H = Holdfast, B1 = 1-die block, B2 = 2-dice block. Outlined: lopsided. Hover for win / draw / loss.</p>`;
  h += '<div class="chart scroll" id="hm"><table class="hm"><tr><th></th>' + vis.map(b => `<th class="col">${short(b)} · ${b.cards}c</th>`).join('') + '<th class="col">mean</th></tr>';
  for (const a of vis) {
    h += `<tr><th class="row"><span class="sw" style="background:${DEF[a.def].color}"></span>${short(a)} · ${a.cards}c</th>`;
    for (const b of vis) {
      if (a.i === b.i) { h += '<td class="self"></td>'; continue; }
      const s = sc(M[a.i][b.i]);
      h += `<td class="${s < 0.4 || s > 0.6 ? 'lop' : ''}" style="background:${cellColor(s)}" data-a="${a.i}" data-b="${b.i}">${pct(s)}</td>`;
    }
    h += `<th>${pct(a.mean)}</th></tr>`;
  }
  h += '</table><div class="tip"></div></div>';
  h += `<h2>The builds at ${X} XP</h2><table class="t"><tr><th>Build</th><th>Board XP</th><th>Defense XP</th><th>Cards</th><th>Mean score</th></tr>` +
    B.filter(b => SHOW[b.def]).map(b => `<tr><td><span class="sw" style="background:${DEF[b.def].color}"></span>${lab(b)}</td><td>${b.board}</td><td>${b.dxp}</td><td>${b.ok ? b.cards : '—'}</td><td>${b.ok ? pct(b.mean) + '%' : "can't afford"}</td></tr>`).join('') + '</table>';
  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('[data-x]').forEach(e => e.addEventListener('click', () => { X = +e.dataset.x; render(); }));
  document.querySelectorAll('[data-d]').forEach(e => e.addEventListener('click', () => { const k = +e.dataset.d; const n = SHOW.filter(Boolean).length; if (SHOW[k] && n === 1) return; SHOW[k] = !SHOW[k]; render(); }));
  const box = document.getElementById('hm'), tip = box.querySelector('.tip');
  box.querySelectorAll('td[data-a]').forEach(td => {
    td.addEventListener('mousemove', e => {
      const a = B[+td.dataset.a], b = B[+td.dataset.b], c = M[a.i][b.i], l = 1000 - c[0] - c[1];
      tip.innerHTML = `<b>${lab(a)}</b> (${a.cards} cards) vs <b>${lab(b)}</b> (${b.cards} cards)<br>score ${(sc(c) * 100).toFixed(1)}% · win ${pct(c[0] / 1000)}% · draw ${pct(c[1] / 1000)}% · loss ${pct(l / 1000)}%`;
      tip.style.display = 'block';
      const bb = box.getBoundingClientRect(); let x = e.clientX - bb.left + box.scrollLeft + 12; if (e.clientX - bb.left + 320 > bb.width) x -= 340;
      tip.style.left = Math.max(0, x) + 'px'; tip.style.top = (e.clientY - bb.top + 14) + 'px';
    });
    td.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
  const mc = document.getElementById('mc'), svg = mc.querySelector('svg'), mt = mc.querySelector('.tip');
  const W = svg.clientWidth || 700, H = 260, L = 40, R = 12, T = 10, Bm = 28;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const x = v => L + (v - 6) / 12.5 * (W - L - R), y = v => T + (1 - v) * (H - T - Bm);
  el('rect', { x: L, y: y(0.55), width: W - L - R, height: y(0.45) - y(0.55), fill: 'var(--foreground)', 'fill-opacity': 0.06 }, svg);
  for (const v of [0, 0.2, 0.4, 0.6, 0.8, 1]) { el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--border)' }, svg); el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted-foreground)' }, svg).textContent = Math.round(v * 100) + '%'; }
  for (const v of [6, 8, 10, 12, 14, 16, 18]) el('text', { x: x(v), y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted-foreground)' }, svg).textContent = v + ' dmg';
  DEF.forEach((d, k) => {
    if (!SHOW[k]) return;
    const pts = vis.filter(b => b.def === k);
    el('path', { d: pts.map((b, i) => (i ? 'L' : 'M') + x(b.damage).toFixed(1) + ' ' + y(b.mean).toFixed(1)).join(''), fill: 'none', stroke: d.color, 'stroke-width': 2 }, svg);
    pts.forEach(b => el('circle', { cx: x(b.damage), cy: y(b.mean), r: 4, fill: d.color, stroke: 'var(--background)', 'stroke-width': 1.5 }, svg));
  });
  const dmgs = [...new Set(vis.map(b => b.damage))];
  svg.addEventListener('mousemove', e => {
    const bb = svg.getBoundingClientRect(), v = 6 + ((e.clientX - bb.left) * W / bb.width - L) / (W - L - R) * 12.5;
    let k = dmgs[0]; dmgs.forEach(dm => { if (Math.abs(dm - v) < Math.abs(k - v)) k = dm; });
    mt.innerHTML = `<b>${k.toFixed(1)} damage</b><br>` + DEF.map((d, j) => { if (!SHOW[j]) return ''; const b = vis.find(q => q.damage === k && q.def === j); return `<span class="sw" style="background:${d.color}"></span>${d.name}: ${b ? b.cards + ' cards, ' + pct(b.mean) + '%' : "can't afford"}<br>`; }).join('');
    mt.style.display = 'block'; let lx = e.clientX - bb.left + 14; if (lx + 240 > bb.width) lx = e.clientX - bb.left - 250; mt.style.left = lx + 'px'; mt.style.top = '8px';
  });
  svg.addEventListener('mouseleave', () => mt.style.display = 'none');
}
render();
let lastW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; render(); } });
</script></body></html>
