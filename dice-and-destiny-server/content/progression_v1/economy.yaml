schema_version: 1
# A new character's XP; campaign victories add more (see campaign.yaml).
starting_xp: 100
default_card_price: 10
characters:
  adventurer:
    # Both editing modes use the character template and shared saved deck.
    starting_abilities:
      offensive: [adventurer_strike, guarded_strike, measured_strike, adventurer_small_straight, adventurer_large_straight, decisive_blow]
      defensive: [adventurer_guard]
    ability_upgrades:
      adventurer_guard: {to: adventurer_guard_plus, xp: 25}
  starter:
    # The Adventurer's mix and board, built only from General tree bases.
    starting_abilities:
      offensive: [adventurer_strike, guarded_strike, measured_strike, adventurer_small_straight, adventurer_large_straight, decisive_blow]
      defensive: [adventurer_guard]

# Pool assignments; omitted items are General. Admin overrides persist separately.
access:
  types: {general: General, venom: Venom, curse: Curse, blade_warden: Blade Warden}
