schema_version: 1
# The progression campaign: fight the encounters in order, earn XP for each
# victory, then spend it on cards and card trees before the next battle. After
# the last encounter the run starts over from the first, keeping all XP and
# cards. A defeat or draw earns nothing; the same encounter is offered again.
#
# Only General-type characters may enter, so campaign decks draw on the General
# card trees, never the Venom or Curse pools.
# Starting character sheets a new campaign can copy. Each campaign save is the
# player's own copy; the original sheet never changes. The first is the default.
# The custom adventurer starts from its Board Builder board (die, template and
# slot picks) at the standard damage level and default defense, then buys
# damage levels and defenses with XP (docs/game-design/board-xp.md).
characters: [starter, adventurer, custom_adventurer]
# Priced ability boards for the other characters: their saves hold this board
# (a menu die and board_templates.yaml template at default picks, standard
# level) and buy damage levels and defenses with XP like the custom
# adventurer. A save started before boards keeps its authored abilities until
# its first board change, which moves it onto this board as part of its kit;
# replaces maps its authored defenses to the menu defenses that take over.
boards:
  starter:
    die: standard_d6
    template: starter
    replaces: {adventurer_guard: holdfast, adventurer_guard_plus: holdfast_plus}
  adventurer:
    die: standard_d6
    template: starter
    replaces: {adventurer_guard: holdfast, adventurer_guard_plus: holdfast_plus}
# A new campaign starts with its sheet's deck and abilities plus this much XP.
bonus_xp: 150
encounters:
  # Ordered by difficulty; see docs/game-design/enemies/bell-diver-and-ribbon-eel.md.
  - id: tide_pool
    name: Tide Pool
    description: A lone Brine Mask stirs in the shallows.
    opponent: drowned_oracle_brine_mask
    opponent_count: 1
    xp: 30
  - id: sunken_belfry
    name: Sunken Belfry
    description: A Bell Diver tolls in the drowned tower, slow and hard to crack.
    opponent: drowned_oracle_bell_diver
    opponent_count: 1
    xp: 38
  - id: kelp_narrows
    name: Kelp Narrows
    description: A Ribbon Eel snares whatever swims past; it almost never misses.
    opponent: drowned_oracle_ribbon_eel
    opponent_count: 1
    xp: 45
