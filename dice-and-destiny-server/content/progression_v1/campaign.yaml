schema_version: 1
# The progression campaign: fight the encounters in order, earn XP for each
# victory, then spend it on cards and card trees before the next battle. After
# the last encounter the run starts over from the first, keeping all XP and
# cards. A defeat or draw earns nothing; the same encounter is offered again.
#
# Only General-type characters may enter, so campaign decks draw on the General
# card trees, never the Venom or Curse pools.
# Starting character sheets a new campaign can copy. Each campaign save is the
# player's own copy; the original sheet never changes. The first is the default.
characters: [starter, adventurer]
# A new campaign starts with its sheet's deck and abilities plus this much XP.
bonus_xp: 100
encounters:
  # Ordered by difficulty; see docs/game-design/enemies/bell-diver-and-ribbon-eel.md.
  - id: tide_pool
    name: Tide Pool
    description: A lone Brine Mask stirs in the shallows.
    opponent: drowned_oracle_brine_mask
    opponent_count: 1
    xp: 20
  - id: sunken_belfry
    name: Sunken Belfry
    description: A Bell Diver tolls in the drowned tower, slow and hard to crack.
    opponent: drowned_oracle_bell_diver
    opponent_count: 1
    xp: 25
  - id: kelp_narrows
    name: Kelp Narrows
    description: A Ribbon Eel snares whatever swims past; it almost never misses.
    opponent: drowned_oracle_ribbon_eel
    opponent_count: 1
    xp: 30
