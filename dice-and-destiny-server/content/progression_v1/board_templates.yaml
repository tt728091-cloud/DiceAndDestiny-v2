  - id: two_mains
    name: Two Mains
    family: "2211"
    defenses: 1
    unlock: open
    slots:
      - {id: mirror_main, job: mirror, cost: main3+apex1, rider: true}
      - {id: mirror_side, job: mirror, cost: side3+apex1, rider: true}
      - {id: flex_hard, job: flex, bands: [hard], cost: main3+side2}
      - {id: flex_medium, job: flex, bands: [medium], cost: odd2}
      - {id: straights, job: straight, cost: SS/LS, rider: true}
      - {id: apex, job: apex, cost: apex4, rider: true}
      - {id: ultimate, job: ultimate, cost: apex5, rider: true}
  - id: spellbook
    name: Spellbook
    family: "2211"
    defenses: 1
    unlock: open
    slots:
      - {id: flex_a, job: flex, bands: [medium], cost: side4}
      - {id: flex_b, job: flex, bands: [hard], cost: side2+apex2}
      - {id: flex_c, job: flex, bands: [medium], cost: main1+side1+odd1+apex1}
      - {id: flex_d, job: flex, bands: [hard], cost: main2+odd2}
      - {id: straights, job: straight, cost: SS/LS, rider: true}
      - {id: apex, job: apex, cost: apex4, rider: true}
      - {id: ultimate, job: ultimate, cost: apex5, rider: true}
  - id: ladder_pair
    name: Ladder Pair
    family: "2211"
    defenses: 2
    unlock: open
    slots:
      - {id: ladder, job: ladder, cost: main3/main4/main5, rider: true}
      - {id: side_ladder, job: side_ladder, cost: side2/side3/side4, rider: true}
      - {id: flex_medium, job: flex, bands: [easy, medium], cost: odd2}
      - {id: small_straight, job: straight, cost: SS, rider: true}
      - {id: large_straight, job: straight, cost: LS, rider: true}
      - {id: apex, job: apex, cost: apex3, rider: true}
      - {id: ultimate, job: ultimate, cost: apex5, rider: true}
