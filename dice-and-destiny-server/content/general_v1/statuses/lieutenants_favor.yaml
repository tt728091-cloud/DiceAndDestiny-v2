schema_version: 1
id: lieutenants_favor
name: Lieutenant's Favor
presentation:
  rules_text: "One stack per living Lieutenant. Each stack adds 1 damage to every damaging attack the Warlord resolves. Lasts the whole battle; it is never used up. If removed, it comes back at the start of the next round (Ongoing Effects). Slaying a Lieutenant on the map removes its stack from the Warlord's future battles."
  glyph: "⚑"
activation_mode: automatic
polarity: positive
stacking: {stack_limit: 10, overflow_policy: reject_additional_stacks}
lifecycle: {persistent: true, consume_on_trigger_checkpoint: false, consume_on_play: false, remove_after_resolution: false, remove_on_duration_zero: false, restore_each_round: true}
modifiers: {attack_damage_bonus: 1}
triggers: []
