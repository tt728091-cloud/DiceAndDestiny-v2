# Tactics Sandbox: replaces Large Straight on Starter/Adventurer Movement.
schema_version: 1
id: fireball
name: Fireball
type: offensive
presentation:
  rules_text: "Five consecutive numbers (1-5 or 2-6). Area 3×3, range 5, line of sight: target a square within 5 squares that you can see when you lock in. When movement ends, deal 8 damage to every enemy standing in the 3×3 area around that square; each one hit defends separately. Enemies that leave the area dodge it. Misses without the required straight."
cost: {energy: 0}
usage: {maximum_per_segment: 1}
targeting: {selector: one_enemy, minimum: 1, maximum: 1}
qualification:
  activation_tiers:
    - id: straight
      requirements:
        all:
          - {type: number_pattern, pattern: large_straight}
      operations:
        - {type: deal_damage, target: selected_targets, amount: 8}
delivery:
  type: area
  range: 5
  line_of_sight: true
  area: {shape: square, radius: 1}
