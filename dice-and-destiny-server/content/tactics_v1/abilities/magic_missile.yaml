# Tactics Sandbox: replaces Small Straight on Starter/Adventurer Movement.
schema_version: 1
id: magic_missile
name: Magic Missile
type: offensive
presentation:
  rules_text: "Any four consecutive numbers (1-4, 2-5, or 3-6); the fifth die may be anything. Deal 6 damage. Range 6, line of sight: target one creature within 6 squares that you can see when you lock in. The missile follows its target and always lands, however far it runs. Misses without the required straight."
cost: {energy: 0}
usage: {maximum_per_segment: 1}
targeting: {selector: one_enemy, minimum: 1, maximum: 1}
qualification:
  activation_tiers:
    - id: straight
      requirements:
        all:
          - {type: number_pattern, pattern: small_straight}
      operations:
        - {type: deal_damage, target: selected_targets, amount: 6}
delivery: {type: direct, range: 6, line_of_sight: true}
