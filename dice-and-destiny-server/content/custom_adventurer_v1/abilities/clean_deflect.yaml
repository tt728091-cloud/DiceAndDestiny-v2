schema_version: 1
id: clean_deflect
name: "Clean Deflect"
type: defensive
presentation:
  rules_text: "Once per defensive segment, choose one incoming attack and roll 1 of your own dice. If it shows the apex symbol (face 6), prevent all damage from that attack; any other symbol prevents nothing. It blocks 1 attack in 6. Saved cards go to discard and still count as health."
cost: {energy: 0}
usage: {maximum_per_segment: 1}
selection:
  requires_incoming_proposal: true
  allowed_proposal_types: [damage_source]
  target_count: 1
resolution:
  reaction_window: {opens: true, pass_required: true}
  operations:
    - type: roll_dice
      id: clean_deflect_roll
      target: self
      dice: owner
      dice_count: 1
      reaction_window: {opens: true, pass_required: true}
      outcomes:
        - roles: [main, side, odd, odd_b]
          operations:
            - {type: noop}
        - roles: [apex]
          operations:
            - {type: prevent_damage, target: selected_proposal, amount: 100}
saved_card_destination: discard
configuration_version: 1
