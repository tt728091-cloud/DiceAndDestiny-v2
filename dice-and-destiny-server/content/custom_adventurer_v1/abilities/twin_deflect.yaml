schema_version: 1
id: twin_deflect
name: "Twin Deflect"
type: defensive
presentation:
  rules_text: "Once per defensive segment, choose one incoming attack and roll 2 of your own dice. If either shows the apex symbol (face 6), prevent all damage from that attack; otherwise it prevents nothing. It blocks 11 attacks in 36 (about 31%). Saved cards go to discard and still count as health."
cost: {energy: 0}
usage: {maximum_per_segment: 1}
selection:
  requires_incoming_proposal: true
  allowed_proposal_types: [damage_source]
  target_count: 1
resolution:
  reaction_window: {opens: true, pass_required: true}
  operations:
    - type: roll_dice
      id: twin_deflect_roll
      target: self
      dice: owner
      dice_count: 2
      reaction_window: {opens: true, pass_required: true}
      outcomes:
        - roles: [main, side, odd, odd_b]
          operations:
            - {type: noop}
        - roles: [apex]
          operations:
            - {type: prevent_damage, target: selected_proposal, amount: 100}
saved_card_destination: discard
configuration_version: 1
