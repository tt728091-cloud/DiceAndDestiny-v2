schema_version: 1
id: the_wayside_shrine
name: "The Wayside Shrine"
set: salt_marches
kind: small
status: scenario
region: salt_marches
# One outcome edge per choice of the event; the choices' texts, rolls and
# rewards are read from the event file, never copied here.
hook: {verb: event, event: wayside_shrine}
trigger:
  - {verb: scenario_start, region: salt_marches}
start: scene
stages:
  - id: scene
    objective: {verb: resolve_event, site: shrine_site}
    outcomes:
      - outcome: success
        when: {verb: event_choice, event: wayside_shrine, choice: offering}
        consequences:
          - {verb: event_outcome, event: wayside_shrine, choice: offering}
        next: end
      - outcome: success
        when: {verb: event_choice, event: wayside_shrine, choice: take_silver}
        consequences:
          - {verb: event_outcome, event: wayside_shrine, choice: take_silver}
        next: end
      - outcome: success
        when: {verb: event_choice, event: wayside_shrine, choice: pray}
        consequences:
          - {verb: event_outcome, event: wayside_shrine, choice: pray}
        next: end
      - outcome: abandoned
        when: {verb: quest_outcome, quest: stop_the_drowned_regent}
        next: end
