schema_version: 1
id: the_wrecked_barge
name: "The Wrecked Barge"
set: salt_marches
kind: small
status: scenario
region: salt_marches
# One outcome edge per choice of the event; the choices' texts, rolls and
# rewards are read from the event file, never copied here.
hook: {verb: event, event: wrecked_barge}
trigger:
  - {verb: scenario_start, region: salt_marches}
start: scene
stages:
  - id: scene
    objective: {verb: resolve_event, site: barge_site}
    outcomes:
      - outcome: success
        when: {verb: event_choice, event: wrecked_barge, choice: search_hold}
        consequences:
          - {verb: event_outcome, event: wrecked_barge, choice: search_hold}
        next: end
      - outcome: success
        when: {verb: event_choice, event: wrecked_barge, choice: salvage}
        consequences:
          - {verb: event_outcome, event: wrecked_barge, choice: salvage}
        next: end
      - outcome: success
        when: {verb: event_choice, event: wrecked_barge, choice: leave}
        consequences:
          - {verb: event_outcome, event: wrecked_barge, choice: leave}
        next: end
      - outcome: abandoned
        when: {verb: quest_outcome, quest: stop_the_drowned_regent}
        next: end
