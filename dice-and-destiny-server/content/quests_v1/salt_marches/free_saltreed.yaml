schema_version: 1
id: free_saltreed
name: Free Saltreed
set: salt_marches
kind: side
status: scenario
region: salt_marches
hook: {verb: scenario_start, region: salt_marches}
trigger:
  - {verb: scenario_start, region: salt_marches}
start: liberate
stages:
  - id: liberate
    objective: {verb: liberate_site, site: saltreed_village}
    outcomes:
      - outcome: success
        text: "The squatters are gone; the village trades like any other."
        consequences:
          - {verb: site_state, site: saltreed_village, state: freed}
        next: end
      - outcome: abandoned
        when: {verb: quest_outcome, quest: stop_the_drowned_regent}
        next: end
