{
  "schema_version": 1,
  "id": "protect",
  "name": "Protect Status",
  "presentation": {
    "rules_text": "Positive status. When your incoming attacks land, each Protect prevents 1 damage on its own, at random across them; it needs no action and costs nothing. Guarded Strike grants 2 Protect; cap 2. Saved damage cards go to discard and still count as health. Unused Protect expires automatically during the next round\u2019s ongoing effects.",
    "glyph": "\u25c7"
  },
  "activation_mode": "automatic",
  "modifiers": {
    "auto_prevention": 1,
    "auto_prevention_destination": "discard"
  },
  "polarity": "positive",
  "stacking": {
    "stack_limit": 2,
    "overflow_policy": "reject_additional_stacks"
  },
  "lifecycle": {
    "persistent": false,
    "consume_on_play": true
  },
  "triggers": [
    {
      "id": "protect_expiry",
      "segment": "ongoing_effects",
      "phase": "entry",
      "stage": "collect_statuses",
      "priority": -1000,
      "operations": [
        {
          "type": "remove_status",
          "target": "self",
          "status_id": "protect"
        }
      ]
    }
  ]
}
