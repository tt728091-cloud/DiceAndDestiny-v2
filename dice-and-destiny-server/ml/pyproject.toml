[project]
name = "dice-destiny-ml"
version = "0.1.0"
description = "Local masked-PPO self-play for the Dice and Destiny Go battle authority"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gymnasium>=1.2,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pyyaml>=6.0,<7",
  "sb3-contrib>=2.7,<3",
  "stable-baselines3>=2.7,<3",
  "torch>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
